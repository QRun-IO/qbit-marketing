  - key: possibleValueSource:marketing_content_revision;slot:help
    summary: "Offers content revisions to choose from."
    content: |
      Used by fields that point to a {{label:marketing_content_revision}} record.
  - key: possibleValueSource:marketing_approval;slot:help
    summary: "Offers approvals to choose from."
    content: |
      Used by fields that point to a {{label:marketing_approval}} record.
  - key: possibleValueSource:marketing_execution;slot:help
